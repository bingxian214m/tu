<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>爱心图床 - 免费在线图片直链工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", sans-serif;
    }
    body {
      background: #000;
      min-height: 100vh;
      padding: 20px;
      color: #fff;
    }
    .header {
      text-align: center;
      margin: 30px 0;
    }
    .header h1 {
      color: #ff69b4;
      font-size: 28px;
      text-shadow: 0 0 12px #ff69b4;
    }
    .header p {
      margin-top: 8px;
      color: #bbb;
      font-size: 15px;
    }
    .upload-box {
      width: 100%;
      max-width: 700px;
      height: 220px;
      margin: 0 auto 30px;
      border: 2px dashed #ff69b4;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .upload-box:hover {
      background: #111;
      box-shadow: 0 0 20px #ff69b444;
    }
    .upload-box input {
      display: none;
    }
    .upload-box .icon {
      color: #ff69b4;
      font-size: 40px;
      margin-bottom: 10px;
    }
    .upload-box label {
      color: #fff;
      background: #ff69b4;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .preview-list {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .img-card {
      background: #111;
      border-radius: 10px;
      overflow: hidden;
      padding: 12px;
    }
    .img-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .link-box {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .link-input {
      flex: 1;
      padding: 6px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }
    .copy-btn {
      padding: 6px 10px;
      background: #ff69b4;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .copy-btn.success {
      background: #25c2a0;
    }
    .heart {
      position: absolute;
      pointer-events: none;
      user-select: none;
      color: #ff69b4;
      z-index: 1;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>❤️ 爱心图床 · 在线图片直链工具</h1>
  <p>上传图片 → 生成永久直链 → 一键复制 | GitHub免费托管</p>
</div>

<div class="upload-box" id="uploadBox">
  <div class="icon">🖼️</div>
  <span>点击/拖拽上传图片</span>
  <label for="fileInput">选择图片</label>
  <input type="file" id="fileInput" accept="image/*" multiple>
</div>

<div class="preview-list" id="previewList"></div>

<script>
// 1. 图片上传 + Base64永久直链生成（GitHub部署专用）
const fileInput = document.getElementById('fileInput');
const previewList = document.getElementById('previewList');
const uploadBox = document.getElementById('uploadBox');

uploadBox.addEventListener('click', () => fileInput.click());

// 拖拽上传
uploadBox.ondragover = (e) => e.preventDefault();
uploadBox.ondrop = (e) => {
  e.preventDefault();
  handleFiles(e.dataTransfer.files);
};

fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

function handleFiles(files) {
  for (let file of files) {
    if (!file.type.startsWith('image/')) continue;
    const reader = new FileReader();
    reader.onload = (e) => {
      const base64Url = e.target.result;
      createCard(base64Url, file.name);
    };
    reader.readAsDataURL(file);
  }
}

function createCard(url, name) {
  const card = document.createElement('div');
  card.className = 'img-card';
  card.innerHTML = `
    <img src="${url}" alt="${name}">
    <div class="link-box">
      <input class="link-input" type="text" value="${url}" readonly>
      <button class="copy-btn" onclick="copy(this)">复制</button>
    </div>
  `;
  previewList.appendChild(card);
}

// 复制链接
function copy(btn) {
  const input = btn.previousElementSibling;
  input.select();
  navigator.clipboard.writeText(input.value);
  btn.textContent = '成功✅';
  btn.classList.add('success');
  setTimeout(() => {
    btn.textContent = '复制';
    btn.classList.remove('success');
  }, 1500);
}

// 2. 爱心鼠标拖尾
const heartOpt = { size:14, color:'#ff69b4', fade:0.7, max:90 };
let heartsArr = [];
let mx=0, my=0;

document.addEventListener('mousemove', e=>{
  mx = e.clientX;
  my = e.clientY;
  createHeart();
});

function createHeart(){
  const h = document.createElement('div');
  h.className = 'heart';
  h.innerText = '❤️';
  h.style.fontSize = heartOpt.size+'px';
  h.style.left = mx+'px';
  h.style.top = my+'px';
  document.body.appendChild(h);
  heartsArr.push(h);
  if(heartsArr.length>heartOpt.max) delHeart(heartsArr.shift());
}

function delHeart(el){
  el.style.opacity = 0;
  setTimeout(()=>el.remove(), heartOpt.fade*1000);
}

setInterval(()=>{
  heartsArr.forEach(item=>{
    item.style.top = parseFloat(item.style.top)-0.9+'px';
  });
},30);
</script>
</body>
</html>
