<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>❤️ 仿图虫自动图库</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei",sans-serif;
    }
    body {
      background: #000;
      min-height: 100vh;
      padding:22px;
      color:#fff;
    }
    .top-title{
      text-align:center;
      margin:32px 0;
    }
    .top-title h1{
      color:#ff69b4;
      font-size:28px;
      text-shadow:0 0 12px #ff69b4;
    }
    .top-title p{
      color:#aaa;margin-top:8px;
    }
    .img-wrap{
      max-width:700px;margin:0 auto;
      display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;
    }
    .card{background:#121212;border-radius:10px;padding:12px;}
    .card img{width:100%;height:135px;object-fit:cover;border-radius:7px;margin-bottom:9px;}
    .link-row{display:flex;gap:6px;margin-bottom:6px;}
    .link-in{flex:1;background:#222;border:1px solid #333;color:#fff;padding:5px;font-size:12px;outline:none;}
    .copy{background:#ff69b4;border:none;padding:0 9px;border-radius:4px;cursor-pointer;color:#000;}
    .copy.ok{background:#27b987;}
    .heart{position:absolute;pointer-events:none;color:#ff69b4;user-select:none;z-index:1;}
  </style>
</head>
<body>
  <div class="top-title">
    <h1>❤️ 仿图虫自动图库</h1>
    <p>上传图片即自动展示｜永久原生外链｜无CDN</p>
  </div>
  <div class="img-wrap" id="listDom"></div>

<script>
const cfg = {
  imgPrefix:"https://bingxian214m.github.io/tu/images/"
};
const listDom = document.getElementById('listDom');

// 🔥 修复：加时间戳，彻底解决缓存问题！
async function loadImages(){
  try{
    // 关键修改：每次读取最新的 files.json，不读缓存
    const res = await fetch(`./files.json?t=${new Date().getTime()}`);
    const list = await res.json();
    list.forEach(name=>{
      const url = cfg.imgPrefix + name;
      createCard(url,name);
    })
  }catch(e){
    listDom.innerHTML = `<p style="color:#ff69b4">暂无图片~</p>`;
    console.error("读取错误：",e);
  }
}

function createCard(src,name){
  const card = document.createElement('div');
  card.className="card";
  card.innerHTML = `
    <img src="${src}" alt="${name}">
    <div class="link-row">
      <input class="link-in" value="${src}" readonly>
      <button class="copy" onclick="copy(this)">复制</button>
    </div>
  `;
  listDom.appendChild(card);
}

window.copy = btn=>{
  navigator.clipboard.writeText(btn.previousElementSibling.value);
  btn.textContent="已复制✅";btn.classList.add("ok");
  setTimeout(()=>{btn.textContent="复制";btn.classList.remove("ok")},1500);
}

// 爱心拖尾
let hearts=[];
document.addEventListener("mousemove",e=>{
  const h=document.createElement("div");
  h.className="heart";h.textContent="❤️";
  h.style.left=e.clientX+"px";h.style.top=e.clientY+"px";
  document.body.appendChild(h);hearts.push(h);
  if(hearts.length>80){hearts.shift().remove();}
});
setInterval(()=>hearts.forEach(h=>h.style.top=parseFloat(h.style.top)-0.9+"px"),30);

loadImages();
</script>
</body>
</html>
